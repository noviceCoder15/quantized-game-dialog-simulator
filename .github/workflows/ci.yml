name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # GitHub only runs workflows from the REPOSITORY ROOT's .github/workflows.
        # If this project sits in a subfolder (e.g. work/quantized-game-dialogue-simulator),
        # copy this file to the root and set the path below.
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch (much smaller than the default wheel)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the rest
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
